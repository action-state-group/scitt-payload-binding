[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cpb"
version = "0.1.0"
description = "Canonical Payload Binding reference library — spec-pure CPB construction and verification"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cpb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
