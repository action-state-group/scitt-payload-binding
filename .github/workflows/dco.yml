# SPDX-License-Identifier: Apache-2.0
# DCO sign-off gate — every commit in a pull request must carry a
# "Signed-off-by: Name <email>" trailer (git commit -s).
# This replaces dependence on the hosted probot DCO app.
#
# Merge commits are out of scope (--no-merges). A merge commit introduces no
# authored content of its own — its parents each carry their own sign-off, and
# those parents are in this range and are checked. Without --no-merges the gate
# fails on merge commits written by GitHub's own UI, which never adds a trailer:
# both the "Merge pull request" and "Update branch" buttons produce one. That
# turns the one required check red for a reason unrelated to any contribution,
# and it cannot be repaired by adding a sign-off commit on top — the offending
# commit has to be rewritten. See PR #60, blocked by 53019fa6.
name: dco

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check DCO sign-off on every commit in the PR
        run: |
          MISSING=0
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          for sha in $(git log --no-merges --format='%H' "$BASE..$HEAD"); do
            body=$(git log -1 --format='%B' "$sha")
            if ! printf '%s' "$body" | grep -qiE '^Signed-off-by: .+ <.+>'; then
              echo "MISSING DCO: $sha  $(git log -1 --format='%s' "$sha")"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "All commits must include a 'Signed-off-by: Name <email>' line."
            echo "Fix with:  git commit -s --amend  (then force-push, or rebase -i)"
            exit 1
          fi
          echo "DCO OK: all commits carry Signed-off-by."
