# SPDX-License-Identifier: Apache-2.0
# Run the CPB reference library unit tests and ruff linter.
# Triggers on lib/ or vectors/ changes. Push runs only on main: pull_request
# already covers PR branches with the same paths, so a branch push would run
# every job a second time.
name: python

on:
  push:
    branches: [main]
    paths: ["lib/**", "vectors/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["lib/**", "vectors/**", ".github/workflows/python.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: install
        working-directory: lib
        run: pip install -e ".[dev]" "ruff>=0.4,<0.16"

      - name: ruff
        working-directory: lib
        run: python -m ruff check .

      - name: pytest
        working-directory: lib
        run: python -m pytest -q
